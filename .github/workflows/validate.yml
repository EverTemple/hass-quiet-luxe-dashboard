name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 0"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # license + images are HACS default-store inclusion checks; this
          # package is installed as a custom repository, which does not
          # require them. Remove from ignore if a LICENSE and README
          # screenshots are added for default-store submission.
          ignore: "license images"
